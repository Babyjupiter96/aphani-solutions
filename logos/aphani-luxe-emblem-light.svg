<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" role="img">
  <title>Aphani emblem — winged A crest over wordmark, on ivory</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&amp;family=Jost:wght@300&amp;display=swap');</style>
  <rect x="0" y="0" width="600" height="490" fill="#F4F2ED"/>
  <line x1="95" y1="160" x2="505" y2="160" stroke="#0A1220" stroke-width="5"/>
  <line x1="130" y1="176" x2="252" y2="176" stroke="#0A1220" stroke-width="3.5"/>
  <line x1="348" y1="176" x2="470" y2="176" stroke="#0A1220" stroke-width="3.5"/>
  <line x1="162" y1="192" x2="244" y2="192" stroke="#0A1220" stroke-width="2.5"/>
  <line x1="356" y1="192" x2="438" y2="192" stroke="#0A1220" stroke-width="2.5"/>
